services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10

  # Kafka-API-wire-compatible single-binary broker (no Zookeeper). V0.2 only
  # needs a standard Kafka producer/consumer protocol -- Redpanda satisfies
  # that with far less clean-room startup flakiness than a Zookeeper+Kafka
  # pair. Swappable for Confluent/Apache Kafka later without app code changes.
  kafka:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://kafka:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: minio:9000
      LOG_LEVEL: INFO
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy

  outbox-relay:
    build: .
    command: ["python", "-m", "outbox_relay.main"]
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "worker.main"]
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: minio:9000
      LOG_LEVEL: INFO
      WORKER_ID: worker-1
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy

  recovery:
    build: .
    command: ["python", "-m", "recovery.main"]
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  scheduler:
    build: .
    command: ["python", "-m", "scheduler.main"]
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  reconciler:
    build: .
    command: ["python", "-m", "reconciler.main"]
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/postgres
      MINIO_ENDPOINT: minio:9000
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
